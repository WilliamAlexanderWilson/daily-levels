name: Update levels

on:
  schedule:
    # GitHub's scheduled-workflow cron is best-effort and has been observed
    # firing 6-9 hours late for this repo - not a one-off, happened on
    # consecutive days. src/run.py no longer gates on "is it exactly 5am
    # Central right now" (a late firing would just see the wrong hour and
    # skip forever); it gates on "has this asset already produced today's
    # data," so extra firings here are harmless no-ops, not wasted work.
    # Every 3 hours maximizes the chance at least one firing lands early
    # enough each day, even with GitHub's jitter.
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run level engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.run --force
          else
            python -m src.run
          fi

      - name: Run backtest scorecard
        # Not gated on the 5am hour like the level engine - it replays
        # history, not "now", so it's deterministic per calendar day and
        # safe to run on every trigger. The commit step below only pushes
        # if something actually changed.
        run: python -m src.backtest.cli

      - name: Run BTC range-strategy holdout lab
        # Public Kraken futures candles provide multi-year 4h history; the
        # spot endpoint's 720-row cap does not. Best-effort so a temporary
        # history outage cannot block the live levels update.
        run: python -m src.range_lab.cli || echo "Range Lab refresh failed, continuing with the prior artifact"

      - name: Refresh market-open reaction research
        # Coinbase asks clients not to poll historical candles frequently.
        # The CLI therefore reuses an artifact younger than 20 hours even
        # though this workflow checks for other live-data changes every 3h.
        run: python -m src.session_reactions.cli || echo "Session reaction refresh failed, continuing with the prior artifact"

      - name: Run SPY exhaustion-reversal backtest
        id: spy_export
        # Also ungated: pulls Alpaca's ~2-year 5m window + Yahoo's VIX,
        # recomputes signals/backtest fresh every trigger (~every 3h)
        # rather than once a day - a trading-day-old signal chart shouldn't
        # wait for the next 5am Central run. An Alpaca/Yahoo hiccup here
        # leaves the prior SPY files in place and lets other data deploy;
        # the workflow then reports the SPY failure. Needs ALPACA_API_KEY/
        # ALPACA_SECRET_KEY set as repo secrets (Settings -> Secrets and
        # variables -> Actions) - a free data-only key from alpaca.markets,
        # not a trading key, nothing here ever places an order.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if python -m src.spy.export; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPY export failed; retaining the prior SPY data"
            git restore -- site/data/spy_chart.json site/data/spy_signals.json site/data/spy_backtest.json site/data/spy_session_reactions.json site/data/spy_range_open_forward.json site/data/archive/spy
            git clean -fd -- site/data/archive/spy
          fi

      - name: Refresh QQQ and NVDA context charts
        id: equity_export
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if python -m src.equities.export; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::QQQ/NVDA export failed; retaining the prior equity data"
            git restore -- site/data/qqq_chart.json site/data/nvda_chart.json site/data/archive/qqq site/data/archive/nvda
            git clean -fd -- site/data/archive/qqq site/data/archive/nvda
          fi

      - name: Refresh XAU gold benchmark archive
        id: xau_export
        # Public Kraken Futures chart data, paged server-side because this
        # endpoint does not expose browser CORS headers. This is published as
        # a delayed benchmark and never labeled as a live execution quote.
        run: |
          if python -m src.metals.export; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::XAU export failed; retaining the prior gold data"
            git restore -- site/data/xau_chart.json site/data/archive/xau
            git clean -fd -- site/data/archive/xau
          fi

      - name: Commit and push data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update levels $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN (the commit above) does
      # NOT trigger deploy-pages.yml's own `on: push` trigger - GitHub
      # suppresses that to avoid recursive workflow runs. So the Pages
      # deploy happens right here, in the same job, instead of relying on
      # that push event.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site

      - name: Wait for Pages artifact indexing
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-pages-artifact.sh

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'

      # Let unaffected data commit and deploy first, then make a failed batch
      # refresh visible as a failed workflow rather than a green run.
      - name: Report batch export failures
        if: ${{ always() && (steps.spy_export.outputs.ok == 'false' || steps.equity_export.outputs.ok == 'false' || steps.xau_export.outputs.ok == 'false') }}
        env:
          SPY_OK: ${{ steps.spy_export.outputs.ok }}
          EQUITY_OK: ${{ steps.equity_export.outputs.ok }}
          XAU_OK: ${{ steps.xau_export.outputs.ok }}
        run: |
          echo "### Batch data refresh failed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SPY_OK" = false ]; then echo "- SPY kept its prior published data." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$EQUITY_OK" = false ]; then echo "- QQQ and NVDA kept their prior published data." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$XAU_OK" = false ]; then echo "- XAU kept its prior published data." >> "$GITHUB_STEP_SUMMARY"; fi
          exit 1
