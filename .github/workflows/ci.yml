name: Quality

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check site JavaScript syntax
        run: npm run check:js

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python tests
        run: python -m pytest -q

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        # Install the browser binary without an apt round trip. Ubuntu 26's
        # mirror DNS failure prevented the browser tests from starting;
        # the browser tests will expose any missing runtime library.
        run: npx playwright install chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
