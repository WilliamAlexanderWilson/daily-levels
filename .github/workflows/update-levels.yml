name: Update levels

on:
  schedule:
    # Cron is UTC. 5 AM America/Chicago is UTC-5 (CDT) or UTC-6 (CST), so
    # fire at both 10:00 and 11:00 UTC; src/run.py exits early unless it's
    # actually the 5 AM hour in Chicago, so only one of these does anything.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run level engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.run --force
          else
            python -m src.run
          fi

      - name: Commit and push data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update levels $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN (the commit above) does
      # NOT trigger deploy-pages.yml's own `on: push` trigger - GitHub
      # suppresses that to avoid recursive workflow runs. So the Pages
      # deploy happens right here, in the same job, instead of relying on
      # that push event.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
