name: Update levels

on:
  schedule:
    # Cron is UTC. 5 AM America/Chicago is UTC-5 (CDT) or UTC-6 (CST), so
    # fire at both 10:00 and 11:00 UTC; src/run.py exits early unless it's
    # actually the 5 AM hour in Chicago, so only one of these does anything.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run level engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m src.run --force
          else
            python -m src.run
          fi

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update levels $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
